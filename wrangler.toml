name = "mouseconfiguratorweb"
compatibility_date = "2026-09-02"

# Static-asset-only Worker: no server code, just serves the Vite build
# output. Cloudflare's Workers Builds already runs `npm run build` (see
# the dashboard's Build command) before this deploy step, so `dist`
# exists by the time `wrangler deploy` reads this file.
[assets]
directory = "./dist"
